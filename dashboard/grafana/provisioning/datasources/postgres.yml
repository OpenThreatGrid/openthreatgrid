apiVersion: 1

datasources:
  - name: OpenThreatGrid
    type: postgres
    access: proxy
    url: ${OTG_DB_HOST:postgres}:${OTG_DB_PORT:5432}
    user: ${OTG_DB_USER:otg}
    database: ${OTG_DB_NAME:otg}
    isDefault: true
    secureJsonData:
      password: ${OTG_DB_PASSWORD:otg}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    editable: false
