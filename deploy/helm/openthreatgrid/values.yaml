# Default values for the OpenThreatGrid chart.

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io/openthreatgrid
  # Always pull because the :main tag is mutable (rebuilt on every push to main).
  pullPolicy: Always
  tag: main

# ─── Ingestion: Filebeat (sidecar) → Logstash → OpenSearch (topology A) ──
# Filebeat ships each sensor's log; one Logstash normalizes + enriches + writes
# to otg-events-*. Filebeat runs as a sidecar in every sensor pod.
filebeat:
  image: docker.elastic.co/beats/filebeat-oss:7.12.1

logstash:
  enabled: true
  image: otg-logstash   # built from deploy/filebeat-logstash/logstash
  javaOpts: "-Xms512m -Xmx512m"
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: 1500m, memory: 1536Mi }

# ─── Cowrie sensor + Filebeat sidecar ──────────────────────────────────
cowrie:
  enabled: true
  image: cowrie
  sensorId: cowrie-prod-01
  resources:
    requests: { cpu: 500m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 512Mi }

# ─── OpenCanary sensor (optional second sensor) ────────────────────────
opencanary:
  enabled: false
  image: opencanary
  sensorId: opencanary-prod-01
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }

# ─── HTTP trap (optional deception web honeypot) ───────────────────────
httpTrap:
  enabled: false
  image: http-trap
  sensorId: http-trap-prod-01
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }

# ─── OpenSearch (primary event store) ──────────────────────────────────
opensearch:
  enabled: true
  image: opensearchproject/opensearch:2.18.0
  storage: 10Gi
  javaOpts: "-Xms1g -Xmx1g"
  resources:
    requests: { cpu: 500m, memory: 1536Mi }
    limits:   { cpu: 2000m, memory: 2Gi }

# ─── OpenSearch Dashboards ─────────────────────────────────────────────
dashboards:
  enabled: true
  image: opensearchproject/opensearch-dashboards:2.18.0
  # Image used by the post-install hook that imports saved objects.
  importImage: curlimages/curl:8.11.1
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 1000m, memory: 1Gi }

# ─── Weekly report CronJob ─────────────────────────────────────────────
reports:
  enabled: true
  image: otg-reports
  schedule: "0 6 * * 1"

networkPolicies:
  enabled: true
