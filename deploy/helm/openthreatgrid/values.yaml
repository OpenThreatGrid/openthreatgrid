# Default values for the OpenThreatGrid chart.

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io/openthreatgrid
  # Always pull because the :main tag is mutable (rebuilt on every push to main).
  pullPolicy: Always
  tag: main

# ─── API ───────────────────────────────────────────────────────────────
api:
  enabled: true
  replicas: 2
  image: otg-api
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# ─── Worker (consumer) ─────────────────────────────────────────────────
worker:
  enabled: true
  replicas: 1
  image: otg-worker
  batchSize: 50
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# ─── Cowrie sensor + parser sidecar ────────────────────────────────────
cowrie:
  enabled: true
  image: cowrie
  sensorId: cowrie-prod-01
  resources:
    requests: { cpu: 500m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 512Mi }

# ─── Redis (in-cluster queue) ──────────────────────────────────────────
redis:
  enabled: true
  image: redis:7-alpine

# ─── OpenSearch (primary event store) ──────────────────────────────────
opensearch:
  enabled: true
  image: opensearchproject/opensearch:2.18.0
  storage: 10Gi
  javaOpts: "-Xms1g -Xmx1g"
  resources:
    requests: { cpu: 500m, memory: 1536Mi }
    limits:   { cpu: 2000m, memory: 2Gi }

# ─── OpenSearch Dashboards ─────────────────────────────────────────────
dashboards:
  enabled: true
  image: opensearchproject/opensearch-dashboards:2.18.0
  # Image used by the post-install hook that imports saved objects.
  importImage: curlimages/curl:8.11.1
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 1000m, memory: 1Gi }

# ─── Weekly report CronJob ─────────────────────────────────────────────
reports:
  enabled: true
  image: otg-reports
  schedule: "0 6 * * 1"

networkPolicies:
  enabled: true
