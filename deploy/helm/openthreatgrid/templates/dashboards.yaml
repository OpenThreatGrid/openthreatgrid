{{- if .Values.dashboards.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  labels:
    app: opensearch-dashboards
    {{- include "otg.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch-dashboards
  template:
    metadata:
      labels:
        app: opensearch-dashboards
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: opensearch-dashboards
          image: {{ .Values.dashboards.image }}
          ports:
            - containerPort: 5601
          env:
            - name: OPENSEARCH_HOSTS
              value: '["http://opensearch:9200"]'
            - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
              value: "true"
          resources:
            {{- toYaml .Values.dashboards.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /api/status, port: 5601 }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dashboards
  labels:
    app: opensearch-dashboards
spec:
  selector:
    app: opensearch-dashboards
  ports:
    - port: 5601
      targetPort: 5601
---
# Saved objects (index pattern + Threat Overview dashboard), generated by
# opensearch/dashboards/build_saved_objects.py and copied into files/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otg-dashboards
  labels:
    {{- include "otg.labels" . | nindent 4 }}
data:
  otg-dashboards.ndjson: |
{{ .Files.Get "files/otg-dashboards.ndjson" | indent 4 }}
---
# OTG index template. Logstash uses manage_template=false, so the bootstrap hook
# below installs this before any events land (otherwise fields default to text).
# Mirrors opensearch/index-templates/otg-events.json.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otg-index-template
  labels:
    {{- include "otg.labels" . | nindent 4 }}
data:
  otg-events.json: |
    {
      "index_patterns": ["otg-events-*"],
      "template": {
        "settings": { "number_of_shards": 1, "number_of_replicas": 0 },
        "mappings": {
          "properties": {
            "event_id": { "type": "keyword" },
            "timestamp": { "type": "date" },
            "ingested_at": { "type": "date" },
            "sensor_id": { "type": "keyword" },
            "sensor_type": { "type": "keyword" },
            "event_type": { "type": "keyword" },
            "source_ip": { "type": "ip" },
            "source_port": { "type": "integer" },
            "destination_ip": { "type": "ip" },
            "destination_port": { "type": "integer" },
            "protocol": { "type": "keyword" },
            "username": { "type": "keyword" },
            "password": { "type": "keyword" },
            "command": { "type": "keyword", "ignore_above": 1024 },
            "payload_url": { "type": "keyword", "ignore_above": 2048 },
            "payload_hash": { "type": "keyword" },
            "session_id": { "type": "keyword" },
            "success": { "type": "boolean" },
            "geo_country": { "type": "keyword" },
            "geo_asn": { "type": "keyword" },
            "tags": { "type": "keyword" },
            "raw_event": { "type": "object", "enabled": false }
          }
        }
      }
    }
---
# Post-install/upgrade hook: import the saved objects once Dashboards is up.
apiVersion: batch/v1
kind: Job
metadata:
  name: otg-dashboards-import
  labels:
    app: otg-dashboards-import
    {{- include "otg.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: otg-dashboards-import
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: import
          image: {{ .Values.dashboards.importImage }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Installing index template..."
              until curl -sf "http://opensearch:9200/_cluster/health" >/dev/null; do sleep 5; done
              curl -sf -X PUT "http://opensearch:9200/_index_template/otg-events" \
                -H "Content-Type: application/json" \
                --data-binary @/template/otg-events.json
              echo "Importing dashboards..."
              until curl -sf "http://opensearch-dashboards:5601/api/status" >/dev/null; do sleep 5; done
              curl -sf -X POST \
                "http://opensearch-dashboards:5601/api/saved_objects/_import?overwrite=true" \
                -H "osd-xsrf: true" \
                --form file=@/objects/otg-dashboards.ndjson
          volumeMounts:
            - name: objects
              mountPath: /objects
              readOnly: true
            - name: template
              mountPath: /template
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: objects
          configMap:
            name: otg-dashboards
        - name: template
          configMap:
            name: otg-index-template
{{- end }}
