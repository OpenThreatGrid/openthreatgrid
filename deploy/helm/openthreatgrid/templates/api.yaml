{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otg-api
  labels:
    app: otg-api
    {{- include "otg.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: otg-api
  template:
    metadata:
      labels:
        app: otg-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otg-api
          image: {{ include "otg.image" (dict "root" . "name" .Values.api.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: production
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: DATABASE_URL
              value: {{ include "otg.databaseUrl" . | quote }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: otg-api
  labels:
    app: otg-api
spec:
  selector:
    app: otg-api
  ports:
    - port: 8000
      targetPort: 8000
{{- end }}
