{{- if .Values.reports.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: otg-weekly-report
  labels:
    app: otg-reports
    {{- include "otg.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.reports.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: otg-reports
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: report
              image: {{ include "otg.image" (dict "root" . "name" .Values.reports.image) }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["--opensearch-url", "http://opensearch:9200", "--days", "7", "--output", "/reports/weekly-latest.md"]
              volumeMounts:
                - name: reports
                  mountPath: /reports
          volumes:
            - name: reports
              emptyDir: {}
{{- end }}
