{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otg-worker
  labels:
    app: otg-worker
    {{- include "otg.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: otg-worker
  template:
    metadata:
      labels:
        app: otg-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: consumer
          image: {{ include "otg.image" (dict "root" . "name" .Values.worker.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["consumer"]
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: OTG_API_URL
              value: http://otg-api:8000
            - name: WORKER_BATCH_SIZE
              value: {{ .Values.worker.batchSize | quote }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
