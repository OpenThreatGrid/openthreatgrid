{{- if .Values.networkPolicies.enabled }}
# Default-deny baseline for the release namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# DNS egress for every pod (additive over default-deny).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# API: ingress from worker/reports/traefik; egress to OpenSearch + Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otg-api-allow
spec:
  podSelector:
    matchLabels:
      app: otg-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: otg-worker } }
        - podSelector: { matchLabels: { app: otg-reports } }
        - namespaceSelector: {}
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports:
        - { protocol: TCP, port: 8000 }
  egress:
    - to:
        - podSelector: { matchLabels: { app: opensearch } }
      ports:
        - { protocol: TCP, port: 9200 }
    - to:
        - podSelector: { matchLabels: { app: redis } }
      ports:
        - { protocol: TCP, port: 6379 }
---
# Worker (consumer): egress to Redis + API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otg-worker-allow
spec:
  podSelector:
    matchLabels:
      app: otg-worker
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app: redis } }
      ports:
        - { protocol: TCP, port: 6379 }
    - to:
        - podSelector: { matchLabels: { app: otg-api } }
      ports:
        - { protocol: TCP, port: 8000 }
---
# OpenSearch: ingress from API + Dashboards only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch-allow
spec:
  podSelector:
    matchLabels:
      app: opensearch
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: otg-api } }
        - podSelector: { matchLabels: { app: opensearch-dashboards } }
      ports:
        - { protocol: TCP, port: 9200 }
---
# Redis: ingress from Worker + Cowrie (parser sidecar) + API (/ready ping).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: otg-worker } }
        - podSelector: { matchLabels: { app: cowrie } }
        - podSelector: { matchLabels: { app: otg-api } }
      ports:
        - { protocol: TCP, port: 6379 }
---
# Dashboards: ingress from Traefik + the import hook; egress to OpenSearch + DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch-dashboards-allow
spec:
  podSelector:
    matchLabels:
      app: opensearch-dashboards
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
        - podSelector: { matchLabels: { app: otg-dashboards-import } }
      ports:
        - { protocol: TCP, port: 5601 }
  egress:
    - to:
        - podSelector: { matchLabels: { app: opensearch } }
      ports:
        - { protocol: TCP, port: 9200 }
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Dashboards import hook: egress to Dashboards + DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otg-dashboards-import-allow
spec:
  podSelector:
    matchLabels:
      app: otg-dashboards-import
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app: opensearch-dashboards } }
      ports:
        - { protocol: TCP, port: 5601 }
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# CRITICAL: Cowrie has no outbound internet — only Redis (parser) + DNS.
# Ingress allowed from Traefik for the honeypot ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cowrie-isolation
spec:
  podSelector:
    matchLabels:
      app: cowrie
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports:
        - { protocol: TCP, port: 2222 }
        - { protocol: TCP, port: 2223 }
  egress:
    - to:
        - podSelector: { matchLabels: { app: redis } }
      ports:
        - { protocol: TCP, port: 6379 }
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- if .Values.reports.enabled }}
---
# Report generator: egress to the API only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otg-reports-allow
spec:
  podSelector:
    matchLabels:
      app: otg-reports
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app: otg-api } }
      ports:
        - { protocol: TCP, port: 8000 }
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- end }}
{{- end }}
