{{- if .Values.networkPolicies.enabled }}
# Default-deny baseline for the release namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# DNS egress for every pod (additive over default-deny).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Logstash: ingress from any sensor pod (Filebeat) on 5044; egress to OpenSearch.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logstash-allow
spec:
  podSelector:
    matchLabels:
      app: logstash
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { otg-role: sensor } }
      ports:
        - { protocol: TCP, port: 5044 }
  egress:
    - to:
        - podSelector: { matchLabels: { app: opensearch } }
      ports:
        - { protocol: TCP, port: 9200 }
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# OpenSearch: ingress from Logstash (ingest), Dashboards, and reports (read).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch-allow
spec:
  podSelector:
    matchLabels:
      app: opensearch
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: logstash } }
        - podSelector: { matchLabels: { app: opensearch-dashboards } }
        - podSelector: { matchLabels: { app: otg-reports } }
        - podSelector: { matchLabels: { app: otg-dashboards-import } }
      ports:
        - { protocol: TCP, port: 9200 }
---
# Dashboards: ingress from Traefik + the import hook; egress to OpenSearch + DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch-dashboards-allow
spec:
  podSelector:
    matchLabels:
      app: opensearch-dashboards
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
        - podSelector: { matchLabels: { app: otg-dashboards-import } }
      ports:
        - { protocol: TCP, port: 5601 }
  egress:
    - to:
        - podSelector: { matchLabels: { app: opensearch } }
      ports:
        - { protocol: TCP, port: 9200 }
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Dashboards import hook: egress to Dashboards + DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otg-dashboards-import-allow
spec:
  podSelector:
    matchLabels:
      app: otg-dashboards-import
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app: opensearch } }
      ports:
        - { protocol: TCP, port: 9200 }
    - to:
        - podSelector: { matchLabels: { app: opensearch-dashboards } }
      ports:
        - { protocol: TCP, port: 5601 }
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# CRITICAL: Cowrie has no outbound internet — only Logstash (Filebeat) + DNS.
# Ingress allowed from Traefik for the honeypot ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cowrie-isolation
spec:
  podSelector:
    matchLabels:
      app: cowrie
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports:
        - { protocol: TCP, port: 2222 }
        - { protocol: TCP, port: 2223 }
  egress:
    - to:
        - podSelector: { matchLabels: { app: logstash } }
      ports:
        - { protocol: TCP, port: 5044 }
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- if .Values.reports.enabled }}
---
# Report generator: egress to OpenSearch (read) + DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otg-reports-allow
spec:
  podSelector:
    matchLabels:
      app: otg-reports
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app: opensearch } }
      ports:
        - { protocol: TCP, port: 9200 }
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- end }}
{{- end }}
