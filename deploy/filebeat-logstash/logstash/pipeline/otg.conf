# OpenThreatGrid — unified Logstash pipeline (topology A).
#
# Filebeat ships each sensor's raw JSON line with a [log_type] field
# (cowrie | opencanary | http-trap). This pipeline reproduces the Python mappers
# + enrichment and writes normalized OTG events straight to OpenSearch.
#
# The OTG index template must already exist (manage_template => false), so run
# scripts/bootstrap_opensearch.sh first. Validate: bin/logstash -t -f otg.conf

input {
  beats { port => 5044 }
}

filter {
  # ── Cowrie ────────────────────────────────────────────────────────────
  if [log_type] == "cowrie" {
    json { source => "message" target => "src" }
    translate {
      source => "[src][eventid]" target => "[event_type]" fallback => "__drop__"
      dictionary => {
        "cowrie.session.connect"       => "connection"
        "cowrie.login.failed"          => "login_attempt"
        "cowrie.login.success"         => "login_success"
        "cowrie.command.input"         => "command_exec"
        "cowrie.command.failed"        => "command_exec"
        "cowrie.session.file_download" => "file_download"
        "cowrie.session.file_upload"   => "file_download"
        "cowrie.session.closed"        => "session_close"
      }
    }
    if [event_type] == "__drop__" { drop {} }
    mutate {
      add_field => { "sensor_type" => "cowrie"  "[ts_raw]" => "%{[src][timestamp]}" }
      copy => {
        "[src][src_ip]"   => "source_ip"     "[src][src_port]" => "source_port"
        "[src][username]" => "username"       "[src][password]" => "password"
        "[src][input]"    => "command"        "[src][url]"      => "payload_url"
        "[src][shasum]"   => "payload_hash"   "[src][session]"  => "session_id"
      }
    }
    if ![sensor_id] { mutate { copy => { "[src][sensor]" => "sensor_id" } } }
    if [src][dst_port] {
      translate { source => "[src][dst_port]" target => "destination_port" override => true
                  fallback => "%{[src][dst_port]}" dictionary => { "12222" => "2222"  "12223" => "2223" } }
      translate { source => "destination_port" target => "protocol"
                  dictionary => { "2222" => "ssh"  "22" => "ssh"  "2223" => "telnet"  "23" => "telnet" } }
    }
    if [src][dst_ip] and [src][dst_ip] != "127.0.0.1" and [src][dst_ip] != "::1" {
      mutate { copy => { "[src][dst_ip]" => "destination_ip" } }
    }
    if [event_type] == "login_success" { mutate { add_field => { "success" => "true" } } }
    else { mutate { add_field => { "success" => "false" } } }

  # ── OpenCanary ────────────────────────────────────────────────────────
  } else if [log_type] == "opencanary" {
    json { source => "message" target => "src" }
    translate {
      source => "[src][logtype]" target => "[event_type]" fallback => "__drop__"
      dictionary => {
        "2000" => "login_attempt"  "3000" => "connection"     "3001" => "login_attempt"
        "4000" => "connection"     "4002" => "login_attempt"  "5001" => "connection"
        "6001" => "login_attempt"  "7001" => "login_attempt"  "8001" => "login_attempt"
        "9001" => "login_attempt"  "9002" => "login_attempt"  "12001" => "login_attempt"
        "14001" => "connection"
      }
    }
    if [event_type] == "__drop__" { drop {} }
    translate {
      source => "[src][logtype]" target => "protocol"
      dictionary => {
        "2000" => "ftp"  "3000" => "http"  "3001" => "http"  "4000" => "ssh"  "4002" => "ssh"
        "6001" => "telnet"  "7001" => "http"  "8001" => "mysql"  "9001" => "mssql"
        "9002" => "mssql"  "12001" => "vnc"  "14001" => "rdp"
      }
    }
    mutate {
      add_field => { "sensor_type" => "opencanary"  "success" => "false"  "[ts_raw]" => "%{[src][utc_time]}" }
      copy => {
        "[src][src_host]" => "source_ip"   "[src][src_port]" => "source_port"
        "[src][dst_port]" => "destination_port"
        "[src][logdata][USERNAME]" => "username"  "[src][logdata][PASSWORD]" => "password"
      }
    }
    if ![sensor_id] { mutate { copy => { "[src][node_id]" => "sensor_id" } } }
    if [src][dst_host] and [src][dst_host] != "127.0.0.1" and [src][dst_host] != "::1" {
      mutate { copy => { "[src][dst_host]" => "destination_ip" } }
    }

  # ── HTTP trap ─────────────────────────────────────────────────────────
  } else if [log_type] == "http-trap" {
    json { source => "message" target => "src" }
    translate {
      source => "[src][trap_event]" target => "[event_type]" fallback => "__drop__"
      dictionary => { "login_attempt" => "login_attempt"  "canary" => "connection"  "request" => "connection" }
    }
    if [event_type] == "__drop__" { drop {} }
    mutate {
      add_field => {
        "sensor_type" => "http-trap"  "protocol" => "http"
        "destination_port" => "8080"  "success" => "false"  "[ts_raw]" => "%{[src][timestamp]}"
      }
      copy => {
        "[src][src_ip]"   => "source_ip"  "[src][src_port]" => "source_port"
        "[src][username]" => "username"    "[src][password]" => "password"
        "[src][path]"     => "payload_url"
      }
    }
    if ![sensor_id] { mutate { copy => { "[src][sensor_id]" => "sensor_id" } } }

  } else {
    drop {}   # unknown source
  }

  # ── Shared: id, time, types, geoip, OTG tagging ───────────────────────
  uuid { target => "event_id" }
  date { match => ["ts_raw", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSSSSS", "yyyy-MM-dd HH:mm:ss"] target => "@timestamp" }
  mutate { convert => { "source_port" => "integer"  "destination_port" => "integer"  "success" => "boolean" } }

  if [source_ip] {
    geoip { source => "source_ip" target => "geoip" }
    if [geoip][country_code2] { mutate { add_field => { "geo_country" => "%{[geoip][country_code2]}" } } }
  }

  ruby {
    code => '
      require "ipaddr"
      st = event.get("sensor_type")
      tags = []
      proto = event.get("protocol"); tags << proto if proto && !proto.to_s.empty?
      ip = event.get("source_ip")
      if ip
        begin
          a = IPAddr.new(ip.to_s)
          tags << "private_ip" if a.private?
          tags << "loopback"   if a.loopback?
        rescue ArgumentError
          tags << "invalid_ip"
        end
      end
      cmd = event.get("command")
      if cmd
        c = cmd.to_s
        tags << "download"    if c =~ /\b(wget|curl|tftp|ftpget)\b/i
        tags << "execution"   if c =~ /(chmod\s+\+?x|\.\/|sh\s+-c|bash\s+-c)/i
        tags << "persistence" if c =~ /(crontab|rc\.local|systemctl|\.ssh\/authorized_keys)/i
        tags << "recon"       if c =~ /(uname|whoami|cat\s+\/proc|\/etc\/passwd|cpuinfo)/i
        tags << "miner"       if c =~ /(xmrig|minerd|stratum\+tcp)/i
        tags << "botnet_indicator" if (tags & ["download","execution","persistence","recon","miner"]).any?
      end
      tags << "payload" if event.get("payload_url")
      gc = event.get("geo_country"); tags << gc if gc
      if st == "opencanary" || st == "http-trap"
        tags << "deception"
      end
      if st == "http-trap"
        tags << "http"
        tev = event.get("[src][trap_event]")
        tags << "credential" if tev == "login_attempt"
        tags << "canary"     if tev == "canary"
        tags << "scan"       if tev == "request"
      end
      event.set("tags", tags.uniq)
      event.set("timestamp", event.get("@timestamp"))
      event.set("ingested_at", Time.now.utc.iso8601(3))
    '
  }

  mutate { rename => { "src" => "raw_event" } }
  mutate {
    remove_field => ["message", "@version", "agent", "ecs", "host", "log",
                     "input", "event", "geoip", "ts_raw", "log_type"]
  }
}

output {
  opensearch {
    hosts           => ["http://opensearch:9200"]
    index           => "otg-events-%{+YYYY.MM.dd}"
    document_id     => "%{event_id}"
    action          => "create"
    manage_template => false
  }
}
