# Core application resources. Apply AFTER:
#   1. Traefik is installed via Helm (deploy/k8s/traefik/values.yaml), and
#   2. the Traefik IngressRouteTCP CRDs exist.
# Then apply the IngressRoutes separately:
#   kubectl apply -f deploy/k8s/traefik/ingressroute-tcp.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openthreatgrid

resources:
  - namespace.yaml
  - networkpolicy-global.yaml
  - opensearch/statefulset.yaml
  - opensearch/service.yaml
  - opensearch-dashboards/deployment.yaml
  - opensearch-dashboards/service.yaml
  - opensearch-dashboards/dashboards-configmap.yaml
  - opensearch-dashboards/index-template-configmap.yaml
  - opensearch-dashboards/bootstrap-job.yaml
  # Ingestion pipeline (topology A): sensors → Filebeat → Logstash → OpenSearch.
  - filebeat/configmap.yaml
  - logstash/deployment.yaml
  - cowrie/deployment.yaml
  - cowrie/service.yaml
  - cowrie/networkpolicy.yaml
  # Optional extra sensors. Uncomment to deploy — each needs its image on GHCR
  # (built by docker-build.yml).
  # - opencanary/configmap.yaml
  # - opencanary/deployment.yaml
  # - opencanary/service.yaml
  # - http-trap/deployment.yaml
  # - http-trap/service.yaml
  - reports/cronjob.yaml
