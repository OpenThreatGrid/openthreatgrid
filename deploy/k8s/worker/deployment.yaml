apiVersion: apps/v1
kind: Deployment
metadata:
  name: otg-worker
  namespace: openthreatgrid
  labels:
    app: otg-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otg-worker
  template:
    metadata:
      labels:
        app: otg-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: consumer
          image: ghcr.io/openthreatgrid/otg-worker:main
          imagePullPolicy: Always
          args: ["consumer"]
          env:
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: OTG_API_URL
              value: "http://otg-api:8000"
            - name: WORKER_BATCH_SIZE
              value: "50"
          resources:
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# Consumer: ingress none; egress to Redis (dequeue) and the API (submit).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otg-worker-allow
  namespace: openthreatgrid
spec:
  podSelector:
    matchLabels:
      app: otg-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: otg-api
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
