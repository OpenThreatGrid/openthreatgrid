# Weekly threat-intelligence report. Runs Mondays 06:00 UTC, writes Markdown to
# a PVC. Labelled app=otg-reports so the postgres NetworkPolicy admits it (the
# generator reaches the API, which reaches Postgres).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: otg-weekly-report
  namespace: openthreatgrid
spec:
  schedule: "0 6 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: otg-reports
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: report
              image: ghcr.io/openthreatgrid/otg-reports:main
              imagePullPolicy: Always
              args:
                - "--api-url"
                - "http://otg-api:8000"
                - "--days"
                - "7"
                - "--output"
                - "/reports/weekly-latest.md"
              resources:
                requests:
                  cpu: "100m"
                  memory: 128Mi
                limits:
                  cpu: "250m"
                  memory: 256Mi
              volumeMounts:
                - name: reports
                  mountPath: /reports
          volumes:
            - name: reports
              persistentVolumeClaim:
                claimName: otg-reports
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: otg-reports
  namespace: openthreatgrid
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# Report generator: egress to the API only (it does not touch Postgres directly).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otg-reports-allow
  namespace: openthreatgrid
spec:
  podSelector:
    matchLabels:
      app: otg-reports
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: otg-api
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
