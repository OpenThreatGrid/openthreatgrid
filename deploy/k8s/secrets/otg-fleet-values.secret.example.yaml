# EXAMPLE ONLY — do not commit a real version of this file.
# Reference for what create-fleet-secret.sh produces. The single key
# "values.yaml" is a Helm values fragment that Fleet merges over the chart
# defaults (see helm.valuesFrom in fleet.yaml).
#
# Apply the REAL secret with:
#   ./create-fleet-secret.sh
# or generate from this template (after replacing the placeholders):
#   kubectl apply -f otg-fleet-values.secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: otg-fleet-values
  namespace: openthreatgrid
type: Opaque
stringData:
  values.yaml: |
    postgres:
      auth:
        password: REPLACE_WITH_STRONG_PASSWORD
    grafana:
      adminPassword: REPLACE_WITH_STRONG_PASSWORD
