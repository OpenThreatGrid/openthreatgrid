# One-shot Job that installs the OTG index template (Logstash uses
# manage_template=false) and imports the saved objects (index pattern + Threat
# Overview dashboard) into OpenSearch Dashboards.
#
# Re-run after updating the template or dashboards:
#   kubectl -n openthreatgrid delete job otg-dashboards-import --ignore-not-found
#   kubectl apply -k deploy/k8s
apiVersion: batch/v1
kind: Job
metadata:
  name: otg-dashboards-import
  namespace: openthreatgrid
  labels:
    app: otg-dashboards-import
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: otg-dashboards-import
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: import
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Installing index template..."
              until curl -sf "http://opensearch:9200/_cluster/health" >/dev/null; do sleep 5; done
              curl -sf -X PUT "http://opensearch:9200/_index_template/otg-events" \
                -H "Content-Type: application/json" \
                --data-binary @/template/otg-events.json
              echo "Waiting for OpenSearch Dashboards..."
              until curl -sf "http://opensearch-dashboards:5601/api/status" >/dev/null; do
                sleep 5
              done
              echo "Importing saved objects..."
              curl -sf -X POST \
                "http://opensearch-dashboards:5601/api/saved_objects/_import?overwrite=true" \
                -H "osd-xsrf: true" \
                --form file=@/objects/otg-dashboards.ndjson
              echo "Done."
          volumeMounts:
            - name: objects
              mountPath: /objects
              readOnly: true
            - name: template
              mountPath: /template
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: objects
          configMap:
            name: otg-dashboards
        - name: template
          configMap:
            name: otg-index-template
---
# The import Job needs egress to the Dashboards service + DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otg-dashboards-import-allow
  namespace: openthreatgrid
spec:
  podSelector:
    matchLabels:
      app: otg-dashboards-import
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: opensearch
      ports:
        - protocol: TCP
          port: 9200
    - to:
        - podSelector:
            matchLabels:
              app: opensearch-dashboards
      ports:
        - protocol: TCP
          port: 5601
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
