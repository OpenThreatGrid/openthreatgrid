apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: openthreatgrid
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
---
# Redis accepts connections only from the parser (Cowrie sidecar) and consumer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow
  namespace: openthreatgrid
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cowrie
        - podSelector:
            matchLabels:
              app: otg-worker
        - podSelector:
            matchLabels:
              app: otg-api
      ports:
        - protocol: TCP
          port: 6379
