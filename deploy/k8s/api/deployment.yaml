apiVersion: apps/v1
kind: Deployment
metadata:
  name: otg-api
  namespace: openthreatgrid
  labels:
    app: otg-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: otg-api
  template:
    metadata:
      labels:
        app: otg-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otg-api
          image: ghcr.io/openthreatgrid/otg-api:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: otg-api-config
            - secretRef:
                name: postgres-credentials
          env:
            # Dependent env var: K8s substitutes $(VAR) from the secret above,
            # keeping the password out of any ConfigMap.
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
          resources:
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
