apiVersion: v1
kind: Service
metadata:
  name: otg-api
  namespace: openthreatgrid
  labels:
    app: otg-api
spec:
  selector:
    app: otg-api
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
# API accepts traffic from the worker (event submission) and Traefik (API
# ingress). Egress to OpenSearch + Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otg-api-allow
  namespace: openthreatgrid
spec:
  podSelector:
    matchLabels:
      app: otg-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: otg-worker
        - podSelector:
            matchLabels:
              app: otg-reports
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: opensearch
      ports:
        - protocol: TCP
          port: 9200
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
