apiVersion: v1
kind: Service
metadata:
  name: opencanary
  namespace: openthreatgrid
  labels:
    app: opencanary
spec:
  selector:
    app: opencanary
  ports:
    - { port: 2121, targetPort: 2121, name: ftp }
    - { port: 2222, targetPort: 2222, name: ssh }
    - { port: 2323, targetPort: 2323, name: telnet }
    - { port: 8080, targetPort: 8080, name: http }
---
# CRITICAL: like Cowrie, the sensor has NO outbound internet — only the parser
# sidecar reaches Redis, plus DNS. Ingress allowed from Traefik for the decoy
# ports. (Wire up Traefik IngressRouteTCP entrypoints to expose them publicly.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opencanary-isolation
  namespace: openthreatgrid
spec:
  podSelector:
    matchLabels:
      app: opencanary
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { protocol: TCP, port: 2121 }
        - { protocol: TCP, port: 2222 }
        - { protocol: TCP, port: 2323 }
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: logstash
      ports:
        - { protocol: TCP, port: 5044 }
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
