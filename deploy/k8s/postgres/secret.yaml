# Demo credentials only. In production create this Secret out-of-band (or via
# a sealed-secret / external-secrets) and enable etcd encryption-at-rest.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: openthreatgrid
type: Opaque
stringData:
  POSTGRES_DB: otg
  POSTGRES_USER: otg
  POSTGRES_PASSWORD: "change-me-in-production"
