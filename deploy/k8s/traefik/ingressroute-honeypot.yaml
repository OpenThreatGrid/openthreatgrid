# Routes the honeypot TCP entrypoints to the Cowrie service. HostSNI(`*`)
# matches all (raw TCP, no TLS SNI on these ports).
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: cowrie-ssh
  namespace: openthreatgrid
spec:
  entryPoints:
    - honeypot-ssh
  routes:
    - match: HostSNI(`*`)
      services:
        - name: cowrie
          port: 2222
          # Re-encode PROXY v2 to the mmproxy sidecar so the real client IP
          # reaches Cowrie.
          proxyProtocol:
            version: 2
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: cowrie-telnet
  namespace: openthreatgrid
spec:
  entryPoints:
    - honeypot-telnet
  routes:
    - match: HostSNI(`*`)
      services:
        - name: cowrie
          port: 2223
          proxyProtocol:
            version: 2
