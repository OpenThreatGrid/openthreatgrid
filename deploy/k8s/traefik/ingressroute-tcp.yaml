# Routes the honeypot TCP entrypoints to the Cowrie service. HostSNI(`*`)
# matches all (raw TCP, no TLS SNI on these ports).
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: cowrie-ssh
  namespace: openthreatgrid
spec:
  entryPoints:
    - honeypot-ssh
  routes:
    - match: HostSNI(`*`)
      services:
        - name: cowrie
          port: 2222
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: cowrie-telnet
  namespace: openthreatgrid
spec:
  entryPoints:
    - honeypot-telnet
  routes:
    - match: HostSNI(`*`)
      services:
        - name: cowrie
          port: 2223
---
# HTTPS (dashboard + API) terminate TLS at Traefik. Hostnames go through
# Cloudflare; see docs/infrastructure.md.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: otg-web
  namespace: openthreatgrid
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`api.openthreatgrid.io`)
      kind: Rule
      services:
        - name: otg-api
          port: 8000
    - match: Host(`dashboard.openthreatgrid.io`)
      kind: Rule
      services:
        - name: opensearch-dashboards
          port: 5601
  tls:
    certResolver: default
