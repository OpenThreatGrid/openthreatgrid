apiVersion: apps/v1
kind: Deployment
metadata:
  name: cowrie
  namespace: openthreatgrid
  labels:
    app: cowrie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cowrie
  template:
    metadata:
      labels:
        app: cowrie
        otg-role: sensor
    spec:
      securityContext:
        # cowrie writes the JSON log to the shared emptyDir as uid 999; fsGroup
        # makes the volume group-readable so the Filebeat sidecar can tail it.
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Loopback routing so go-mmproxy's transparent replies route back through it.
        - name: setup-routing
          image: ghcr.io/openthreatgrid/mmproxy:main
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - |
              ip rule add from 127.0.0.1/8 iif lo table 123 || true
              ip route add local 0.0.0.0/0 dev lo table 123 || true
          securityContext:
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
      containers:
        # ── Honeypot (localhost only; locked down) ────────────────────
        - name: cowrie
          image: ghcr.io/openthreatgrid/cowrie:main
          imagePullPolicy: Always
          resources:
            requests: { cpu: "500m", memory: 256Mi }
            limits:   { cpu: "1000m", memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: cowrie-logs, mountPath: /cowrie/var/log/cowrie }
            - { name: cowrie-config, mountPath: /cowrie/cowrie-git/etc/cowrie.cfg, subPath: cowrie.cfg }
        # ── mmproxy: SSH (restores real client IP) ────────────────────
        - name: mmproxy-ssh
          image: ghcr.io/openthreatgrid/mmproxy:main
          imagePullPolicy: Always
          args: ["-l", "0.0.0.0:2222", "-4", "127.0.0.1:12222", "-p", "tcp"]
          ports: [{ containerPort: 2222, name: ssh }]
          resources:
            requests: { cpu: "50m", memory: 32Mi }
            limits: { cpu: "200m", memory: 64Mi }
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
        # ── mmproxy: Telnet ───────────────────────────────────────────
        - name: mmproxy-telnet
          image: ghcr.io/openthreatgrid/mmproxy:main
          imagePullPolicy: Always
          args: ["-l", "0.0.0.0:2223", "-4", "127.0.0.1:12223", "-p", "tcp"]
          ports: [{ containerPort: 2223, name: telnet }]
          resources:
            requests: { cpu: "50m", memory: 32Mi }
            limits: { cpu: "200m", memory: 64Mi }
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
        # ── Filebeat sidecar: ships cowrie.json to Logstash ───────────
        - name: filebeat
          image: docker.elastic.co/beats/filebeat-oss:7.12.1
          args: ["-e", "--strict.perms=false"]
          env:
            - { name: LOG_TYPE, value: "cowrie" }
            - { name: LOG_PATH, value: "/cowrie/var/log/cowrie/cowrie.json" }
            - { name: SENSOR_ID, value: "cowrie-prod-01" }
            - { name: LOGSTASH_HOST, value: "logstash:5044" }
          resources:
            requests: { cpu: "50m", memory: 64Mi }
            limits: { cpu: "200m", memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: cowrie-logs, mountPath: /cowrie/var/log/cowrie, readOnly: true }
            - { name: filebeat-config, mountPath: /usr/share/filebeat/filebeat.yml, subPath: filebeat.yml, readOnly: true }
            - { name: filebeat-data, mountPath: /usr/share/filebeat/data }
      volumes:
        - name: cowrie-logs
          emptyDir: {}
        - name: cowrie-config
          configMap:
            name: cowrie-config
        - name: filebeat-config
          configMap:
            name: filebeat-config
        - name: filebeat-data
          emptyDir: {}
