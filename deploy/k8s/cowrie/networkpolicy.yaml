# CRITICAL ISOLATION POLICY
# Cowrie must never be usable as a relay. Ingress only from Traefik; egress
# only to Logstash (for the Filebeat sidecar) and DNS. NO outbound internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cowrie-isolation
  namespace: openthreatgrid
spec:
  podSelector:
    matchLabels:
      app: cowrie
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Honeypot traffic arrives via Traefik (TCP IngressRoute).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 2222
        - protocol: TCP
          port: 2223
  egress:
    # Filebeat sidecar -> Logstash only.
    - to:
        - podSelector:
            matchLabels:
              app: logstash
      ports:
        - protocol: TCP
          port: 5044
    # DNS resolution.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
