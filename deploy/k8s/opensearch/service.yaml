apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: openthreatgrid
  labels:
    app: opensearch
spec:
  selector:
    app: opensearch
  ports:
    - port: 9200
      targetPort: 9200
      name: http
---
# OpenSearch accepts connections only from Logstash (ingestion), OpenSearch
# Dashboards (visualization), and the report generator (read).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch-allow
  namespace: openthreatgrid
spec:
  podSelector:
    matchLabels:
      app: opensearch
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: logstash
        - podSelector:
            matchLabels:
              app: opensearch-dashboards
        - podSelector:
            matchLabels:
              app: otg-reports
        - podSelector:
            matchLabels:
              app: otg-dashboards-import
      ports:
        - protocol: TCP
          port: 9200
