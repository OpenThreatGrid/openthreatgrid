apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: openthreatgrid
  labels:
    app: opensearch
spec:
  selector:
    app: opensearch
  ports:
    - port: 9200
      targetPort: 9200
      name: http
---
# OpenSearch accepts connections only from the API (ingestion/query) and
# OpenSearch Dashboards (visualization).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch-allow
  namespace: openthreatgrid
spec:
  podSelector:
    matchLabels:
      app: opensearch
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: otg-api
        - podSelector:
            matchLabels:
              app: opensearch-dashboards
      ports:
        - protocol: TCP
          port: 9200
