# OpenThreatGrid — DigitalOcean VPS edge proxy
# /etc/haproxy/haproxy.cfg
#
# Terminates raw internet traffic on 2222/2223/443 and forwards it across the
# Tailscale tunnel to the K8s worker's Traefik NodePorts, sending PROXY
# PROTOCOL v2 so the real attacker source IP is preserved end-to-end.
#
# Replace <TAILSCALE_IP_WORKER> with the worker node's Tailscale IP before use.

global
    log /dev/log local0
    maxconn 4096
    user haproxy
    group haproxy
    daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 10s
    timeout client  300s      # honeypot sessions can be long-lived
    timeout server  300s
    retries 3

# ─── STATS (Tailscale-only; bind to the VPS Tailscale IP) ──────────────
frontend stats
    bind <TAILSCALE_IP_DO_VPS>:8404   # setup-edge.sh substitutes the VPS Tailscale IP
    mode http
    stats enable
    stats uri /
    stats refresh 10s
    stats admin if TRUE

# ─── HONEYPOT FRONTENDS ────────────────────────────────────────────────
frontend ft_honeypot_ssh
    bind *:2222
    mode tcp
    default_backend bk_cowrie_ssh

frontend ft_honeypot_telnet
    bind *:2223
    mode tcp
    default_backend bk_cowrie_telnet

# ─── LEGITIMATE FRONTEND ───────────────────────────────────────────────
frontend ft_https
    bind *:443
    mode tcp
    default_backend bk_traefik_https

# ─── BACKENDS (all send PROXY PROTOCOL v2) ─────────────────────────────
# NOTE: no `check` — TCP health checks would hit Cowrie every ~2s and pollute
# the honeypot logs with empty sessions. HAProxy just forwards real connections.
backend bk_cowrie_ssh
    mode tcp
    server worker1 <TAILSCALE_IP_WORKER>:30022 send-proxy-v2

backend bk_cowrie_telnet
    mode tcp
    server worker1 <TAILSCALE_IP_WORKER>:30023 send-proxy-v2

backend bk_traefik_https
    mode tcp
    server worker1 <TAILSCALE_IP_WORKER>:30443 send-proxy-v2
