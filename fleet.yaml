# Rancher Fleet (Continuous Delivery) bundle definition.
#
# Deploys the OpenThreatGrid Helm chart to the LOCAL cluster (workspace
# fleet-local). Point a Fleet App Bundle / Git Repo at this repo with:
#   Branch : main
#   Paths  : /            (this file lives at the repo root)
#
# Fleet renders the chart in deploy/helm/openthreatgrid into namespace
# "openthreatgrid".

defaultNamespace: openthreatgrid

helm:
  releaseName: otg
  chart: deploy/helm/openthreatgrid
  # Give slow image pulls room on the first deploy before failing the bundle.
  timeoutSeconds: 600
  # Non-secret configuration. Override per-cluster below if needed.
  values:
    image:
      registry: ghcr.io/openthreatgrid
      tag: main
    api:
      enabled: true
      replicas: 2
    worker:
      enabled: true
    cowrie:
      enabled: true
      sensorId: cowrie-prod-01
    redis:
      enabled: true
    opensearch:
      enabled: true
      storage: 100Gi
    dashboards:
      enabled: true
    reports:
      enabled: true
    networkPolicies:
      enabled: true

  # OpenSearch runs internal-only with the security plugin disabled, so no
  # database/dashboard passwords are required. If you enable the security
  # plugin for exposure, layer credentials in from a cluster Secret here:
  #   valuesFrom:
  #     - secretKeyRef: { name: otg-fleet-values, namespace: openthreatgrid, key: values.yaml }
