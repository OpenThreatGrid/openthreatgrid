# OpenThreatGrid — full local development pipeline.
#
#   Cowrie ──► parser ──► Redis ──► consumer ──► API ──► OpenSearch ──► Dashboards
#
# Quick start:  ./scripts/run_local.sh   (or: docker compose up --build)
# After the stack is healthy, load the index template + dashboards:
#   ./scripts/bootstrap_opensearch.sh

services:
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      # Local dev only: disable the security plugin so no TLS/auth is required.
      # NEVER do this on an internet-exposed cluster.
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - os-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.18.0
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend/otg-api
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy

  consumer:
    build: ./workers/otg-worker
    command: ["consumer"]
    environment:
      REDIS_URL: redis://redis:6379/0
      OTG_API_URL: http://api:8000
    depends_on:
      - api
      - redis

  cowrie:
    image: cowrie/cowrie:latest
    # Expose the honeypot locally so you can poke it: ssh -p 2222 root@localhost
    ports:
      - "2222:2222"
      - "2223:2223"
    volumes:
      - cowrie-logs:/cowrie/var/log/cowrie

  parser:
    build: ./workers/otg-worker
    command: ["parser"]
    environment:
      REDIS_URL: redis://redis:6379/0
      COWRIE_LOG_PATH: /cowrie/var/log/cowrie/cowrie.json
      SENSOR_ID: cowrie-local-01
    volumes:
      - cowrie-logs:/cowrie/var/log/cowrie:ro
    depends_on:
      - redis
      - cowrie

volumes:
  os-data:
  cowrie-logs:
