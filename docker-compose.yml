# OpenThreatGrid — local development pipeline (topology A).
#
#   Cowrie ──► Filebeat ──► Logstash ──► OpenSearch ──► OpenSearch Dashboards
#
# Quick start:  ./scripts/run_local.sh   (or the steps below)
#   1. docker compose up -d opensearch opensearch-dashboards   # wait healthy
#   2. ./scripts/bootstrap_opensearch.sh                       # template + dashboards
#   3. docker compose up -d --build                            # rest of the stack
#   4. ssh -p 2222 root@localhost                              # attack the honeypot

services:
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "9200:9200"
    volumes:
      - os-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.18.0
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  logstash:
    build: ./deploy/filebeat-logstash/logstash
    volumes:
      - ./deploy/filebeat-logstash/logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    depends_on:
      opensearch:
        condition: service_healthy

  cowrie:
    image: cowrie/cowrie:latest
    # Poke the honeypot:  ssh -p 2222 root@localhost
    ports:
      - "2222:2222"
      - "2223:2223"
    volumes:
      - cowrie-logs:/cowrie/var/log/cowrie

  filebeat:
    image: docker.elastic.co/beats/filebeat-oss:7.12.1
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    environment:
      - LOG_TYPE=cowrie
      - LOG_PATH=/cowrie/var/log/cowrie/cowrie.json
      - SENSOR_ID=cowrie-local-01
      - LOGSTASH_HOST=logstash:5044
    volumes:
      - ./deploy/filebeat-logstash/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - cowrie-logs:/cowrie/var/log/cowrie:ro
    depends_on:
      - logstash
      - cowrie

volumes:
  os-data:
  cowrie-logs:
