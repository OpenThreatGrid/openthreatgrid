{
  "device.node_id": "opencanary-01",
  "ip.ignorelist": [],
  "logtype.ignorelist": [],

  "ftp.enabled": true,
  "ftp.port": 2121,
  "ftp.banner": "FTP server ready",

  "http.enabled": true,
  "http.port": 8080,
  "http.banner": "Apache/2.2.22 (Ubuntu)",
  "http.skin": "nasLogin",

  "ssh.enabled": true,
  "ssh.port": 2222,
  "ssh.version": "SSH-2.0-OpenSSH_5.1p1 Debian-4",

  "telnet.enabled": true,
  "telnet.port": 2323,
  "telnet.banner": "",

  "smb.enabled": false,
  "mysql.enabled": false,
  "mssql.enabled": false,
  "vnc.enabled": false,
  "tftp.enabled": false,
  "ntp.enabled": false,
  "tcpbanner.enabled": false,
  "snmp.enabled": false,
  "rdp.enabled": false,
  "sip.enabled": false,
  "git.enabled": false,
  "redis.enabled": false,
  "portscan.enabled": false,

  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": { "format": "%(message)s" }
      },
      "handlers": {
        "file": {
          "class": "logging.FileHandler",
          "formatter": "plain",
          "filename": "/var/log/opencanary/opencanary.log"
        }
      }
    }
  }
}
