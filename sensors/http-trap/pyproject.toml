[project]
name = "otg-http-trap"
version = "0.1.0"
description = "OpenThreatGrid HTTP deception trap"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
