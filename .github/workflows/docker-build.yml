name: Docker Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: otg-reports
            context: reports
          - image: cowrie
            context: sensors/cowrie
          - image: mmproxy
            context: sensors/mmproxy
          - image: opencanary
            context: sensors/opencanary
          - image: http-trap
            context: sensors/http-trap
          - image: otg-logstash
            context: deploy/filebeat-logstash/logstash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Only push on main/tags, not on PRs from forks.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pin the deploy to the immutable per-commit image tag (sha-<short>) so Fleet
  # sees a changed spec and rolls every component — fixing the "mutable :main tag
  # never triggers a rollout" problem. The GITHUB_TOKEN push does not re-trigger
  # this workflow (and carries [skip ci]), so there is no build loop.
  pin-deploy-tag:
    name: pin deploy image tag
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pin-deploy-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Update fleet.yaml image tag
        run: ./scripts/bump_image_tag.sh "sha-$(git rev-parse --short=7 HEAD)"
      - name: Commit if changed
        run: |
          if git diff --quiet -- fleet.yaml; then
            echo "fleet.yaml already pinned; nothing to do."
            exit 0
          fi
          git config user.name "otg-ci[bot]"
          git config user.email "otg-ci@users.noreply.github.com"
          git add fleet.yaml
          git commit -m "ci: pin deploy image tag to sha-$(git rev-parse --short=7 HEAD) [skip ci]"
          git push
