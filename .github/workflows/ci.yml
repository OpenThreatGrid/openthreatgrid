name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  http-trap:
    name: http-trap (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sensors/http-trap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest

  reports:
    name: reports (test + render)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pytest
        run: pytest
      - name: Generate example report from sample events
        run: python generate_report.py --from-file ../examples/sample-events/otg-events.json --output /tmp/report.md
      - name: Report is non-empty
        run: test -s /tmp/report.md

  manifests:
    name: helm + manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint deploy/helm/openthreatgrid
      - name: Helm template
        run: helm template otg deploy/helm/openthreatgrid > /dev/null
